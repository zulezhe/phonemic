name = "phonemic-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 部署时自动创建 relay.dyzyzj.top 的 DNS 记录与证书
routes = [
  { pattern = "relay.dyzyzj.top", custom_domain = true }
]

[durable_objects]
bindings = [{ name = "ROOM", class_name = "PairingRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingRoom" ]

# 手机页静态资源（远程模式由 P3c 启用；先托管，等页面支持中继协议）
[assets]
directory = "../phone/dist"
binding = "ASSETS"

[vars]
# 等待配对超时（毫秒）
WAIT_TTL_MS = "60000"
# 单会话最长时长
SESSION_MAX_MS = "14400000"
