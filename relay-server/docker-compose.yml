# PhoneMic 自托管中继
# 使用：docker compose up -d --build
# 桌面端连接自建中继（任选一种）：
#   1) 启动 PhoneMic 前设环境变量：
#      PHONEMIC_RELAY_HOST=relay.example.com PHONEMIC_PAGE_URL_BASE=https://relay.example.com
#   2) TLS 由前置反代终结（推荐 Caddy，见 docs/self-hosting.md）
services:
  relay:
    build:
      context: ..
      dockerfile: relay-server/Dockerfile
      args:
        # 国内网络构建启用 rsproxy 镜像源（海外环境删掉这两行）
        RS_PROXY: "1"
    image: phonemic-relay
    restart: unless-stopped
    ports:
      - "9430:9430"
    environment:
      LISTEN: 0.0.0.0:9430
      # 等待配对超时（秒）
      WAIT_TTL_SECS: "3600"
      # 单会话时长上限（秒）
      SESSION_MAX_SECS: "14400"
      # 全局并发房间上限（滥用防护）
      MAX_ROOMS: "100"
      # 每 IP 每分钟新建房间数（滥用防护）
      IP_ROOMS_PER_MIN: "30"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9430/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
