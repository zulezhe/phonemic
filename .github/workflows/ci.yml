name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust（macOS）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install cmake
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix phone install
      - run: npm --prefix phone run build   # rust-embed 需要 phone/dist 存在
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      # 在 src-tauri 内执行以应用 .cargo/config.toml（audiopus 的 cmake 兼容）；
      # runner 偶发 DNS 瞬断，失败自动重试一次
      - run: cd src-tauri && (cargo test || (sleep 15 && cargo test))

  web:
    name: 前端（桌面 UI + 手机页）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm --prefix phone install
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p phone/tsconfig.json
      - run: npm --prefix phone run build

  relay:
    name: 中继（Cloudflare Worker）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix relay install
      - run: npx --prefix relay tsc -p relay/tsconfig.json

  windows:
    name: Rust（Windows，测试 + NSIS 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix phone install
      - run: npm --prefix phone run build   # rust-embed 需要 phone/dist 存在
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - name: cargo test
        run: cargo test
        working-directory: src-tauri
      - name: tauri build（NSIS 安装包）
        run: |
          npm ci
          npm run build
          npx tauri build --bundles nsis --config src-tauri/tauri.windows.conf.json
        shell: pwsh
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        # 账号级 Artifact 存储配额可能被占满（免费额度全账号共享）；
        # 构建成功即本 job 的核心目标，上传失败不置红。配额恢复后
        # `gh run rerun --failed` 即可重新上传。
        continue-on-error: true
        with:
          name: phonemic-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
