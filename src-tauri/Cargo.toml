[package]
name = "phonemic"
version = "0.1.0"
description = "Use your phone as a microphone for your computer"
edition = "2021"
default-run = "phonemic"

[lib]
name = "phonemic"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
cpal = "0.15"
opus = "0.3"
parking_lot = "0.12"
anyhow = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
hound = "3"
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
qrcode = "0.14"
mdns-sd = "0.11"
dirs = "5"
# P3c 远程中继 + E2EE
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"

[[bin]]
name = "phonemic-server"
path = "src/bin/phonemic-server.rs"

[dev-dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = true           # 跨 crate 聚合优化
strip = true         # 去符号
opt-level = "s"      # 体积优先（音频回调是简单内存拷贝，无高性能诉求）
codegen-units = 1    # 单元合并，更小更慢编译
panic = "abort"      # 去栈展开表
